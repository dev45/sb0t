name: linux-build
on:
  push:
    branches: [migracion-net]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Compilar en Linux
        run: dotnet build roomhost/roomhost.csproj -c Release

      - name: Construir imagen
        run: docker build -t areschat-room .

      - name: Autoprueba (Skia, Hunspell, Jurassic, SQLite)
        run: docker run --rm -e ROOM_DATA=/tmp/selftest areschat-room --selftest

      - name: Arrancar la sala y comprobar
        run: |
          docker run -d --name sala -p 5009:5009/tcp -e ROOM_NAME="Sala CI" -e ROOM_OWNER="clave-de-prueba-ci" areschat-room
          sleep 20
          echo "=== logs ==="
          docker logs sala
          echo "=== contenedor ==="
          docker ps -a --filter name=sala
          echo "=== puerto ==="
          nc -z localhost 5009 && echo "PUERTO ABIERTO" || (echo "PUERTO CERRADO"; exit 1)
          echo "=== archivos de la sala ==="
          docker exec sala ls -R /data || true

      - name: Parar con docker stop (debe cerrar limpio)
        run: |
          time docker stop sala
          docker logs sala | tail -n 5

      - name: API de administracion de la sala
        run: |
          T=token-de-prueba-ci-0123456789abcdef
          docker run -d --name sala-admin -p 5010:5010 -p 8081:8081 \
            -e ROOM_PORT=5010 -e ROOM_OWNER=dueno-de-prueba-ci -e ROOM_ADMIN_TOKEN=$T areschat-room
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8081/admin/status && break; sleep 2; done

          echo "=== sin token: debe dar 401 ==="
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/admin/status)" = "401"
          echo "=== con token: estado ==="
          curl -sf -H "Authorization: Bearer $T" http://localhost:8081/admin/status | tee status.json; echo
          grep -q '"running":true' status.json
          echo "=== ajuste no permitido (name): debe dar 400 ==="
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d '{"name":"x"}' http://localhost:8081/admin/settings)" = "400"
          echo "=== guardar tema ==="
          curl -sf -X PUT -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d '{"topic":"tema desde la API","captcha":true}' http://localhost:8081/admin/settings; echo
          docker restart sala-admin
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8081/admin/status && break; sleep 2; done
          echo "=== tras reiniciar el tema debe persistir ==="
          curl -sf -H "Authorization: Bearer $T" http://localhost:8081/admin/status | tee status2.json; echo
          grep -q 'tema desde la API' status2.json
          docker rm -f sala-admin
      - name: API de administracion - usuarios, bans, tema y anuncios
        run: |
          T=token-de-prueba-ci-0123456789abcdef
          H="Authorization: Bearer $T"
          docker run -d --name sala-admin2 -p 5011:5011 -p 8082:8082 \
            -e ROOM_PORT=5011 -e ROOM_OWNER=dueno-de-prueba-ci -e ROOM_ADMIN_TOKEN=$T \
            -e ROOM_ADMIN_URL=http://0.0.0.0:8082 areschat-room
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8082/admin/status && break; sleep 2; done
          sleep 5

          echo "=== usuarios (debe ser []) ==="
          test "$(curl -sf -H "$H" http://localhost:8082/admin/users)" = "[]"
          echo "=== bans (debe ser []) ==="
          test "$(curl -sf -H "$H" http://localhost:8082/admin/bans)" = "[]"
          echo "=== estadisticas ==="
          curl -sf -H "$H" http://localhost:8082/admin/stats; echo
          echo "=== cambiar el tema en vivo (usa la cola del hilo del servidor) ==="
          curl -sf -X PUT -H "$H" -H 'Content-Type: application/json' -d '{"text":"tema en vivo desde la API"}' http://localhost:8082/admin/topic; echo
          curl -sf -H "$H" http://localhost:8082/admin/status | grep -q 'tema en vivo desde la API'
          echo "=== anuncio sin usuarios (debe enviar a 0) ==="
          curl -sf -X POST -H "$H" -H 'Content-Type: application/json' -d '{"text":"hola a todos"}' http://localhost:8082/admin/announce | tee ann.json; echo
          grep -q '"sent":0' ann.json
          echo "=== expulsar un usuario inexistente: 404 ==="
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$H" http://localhost:8082/admin/users/4242/kick)" = "404"
          echo "=== desbanear algo inexistente: 404 ==="
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$H" -H 'Content-Type: application/json' -d '{"id":"x"}' http://localhost:8082/admin/bans/unban)" = "404"
          echo "=== tema demasiado corto: 400 ==="
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "$H" -H 'Content-Type: application/json' -d '{"text":"x"}' http://localhost:8082/admin/topic)" = "400"
          docker logs sala-admin2 | tail -n 10
          docker rm -f sala-admin2
      - name: Gestor con Docker real (crear, comprobar, parar, borrar sala)
        env:
          MANAGER_ADMIN_PASSWORD: ci-admin-password-1234
          ROOM_IMAGE: areschat-room
          ASPNETCORE_URLS: http://localhost:5080
        run: |
          dotnet build manager -c Release
          dotnet run --project manager -c Release --no-build > manager.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:5080/ && break; sleep 2; done

          echo "=== sin sesion debe dar 401 ==="
          curl -s -o /dev/null -w "%{http_code}\n" http://localhost:5080/api/rooms

          curl -sf -c jar -H 'Content-Type: application/json' -d '{"password":"ci-admin-password-1234"}' http://localhost:5080/api/login
          echo "=== crear sala ==="
          RESP=$(curl -sf -b jar -H 'Content-Type: application/json' -d '{"name":"Sala gestor","ownerPassword":"dueno-de-prueba-1"}' http://localhost:5080/api/rooms)
          echo "$RESP"
          ID=$(echo "$RESP" | grep -o '"id":"[^"]*"' | cut -d'"' -f4)
          sleep 20

          echo "=== estado ==="
          curl -sf -b jar http://localhost:5080/api/rooms; echo
          echo "=== logs de la sala ==="
          LOGS=$(curl -sf -b jar "http://localhost:5080/api/rooms/$ID/logs?tail=20")
          echo "$LOGS"
          echo "$LOGS" | grep -q "Server initialized on port 5009" || { echo "FALTA la linea de arranque en los logs"; exit 1; }
          if echo "$LOGS" | LC_ALL=C grep -qP '[\x00-\x08\x0e-\x1f]'; then echo "LOGS CON CARACTERES DE CONTROL"; exit 1; fi
          echo "=== puerto ==="
          nc -z localhost 5009 && echo "PUERTO ABIERTO" || { echo "PUERTO CERRADO"; docker ps -a; cat manager.log; exit 1; }

          echo "=== panel por sala: estado a traves del gestor ==="
          curl -sf -b jar "http://localhost:5080/api/rooms/$ID/admin/status" | tee astatus.json; echo
          grep -q '"running":true' astatus.json
          echo "=== panel por sala: cambiar el tema y leerlo ==="
          curl -sf -b jar -X PUT -H 'Content-Type: application/json' -d '{"text":"tema desde el gestor"}' "http://localhost:5080/api/rooms/$ID/admin/topic"; echo
          curl -sf -b jar "http://localhost:5080/api/rooms/$ID/admin/status" | grep -q 'tema desde el gestor'
          echo "=== panel por sala: ruta no permitida debe dar 404 ==="
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar "http://localhost:5080/api/rooms/$ID/admin/nada")" = "404"
          echo "=== panel por sala: sin sesion debe dar 401 ==="
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:5080/api/rooms/$ID/admin/status")" = "401"
          echo "=== detener ==="
          time curl -sf -b jar -X POST "http://localhost:5080/api/rooms/$ID/stop"
          curl -sf -b jar http://localhost:5080/api/rooms; echo
          echo "=== eliminar con datos ==="
          curl -sf -b jar -X DELETE "http://localhost:5080/api/rooms/$ID?purge=true"
          echo "contenedores restantes:"; docker ps -a --filter name=areschat-room-
          echo "volumenes restantes:"; docker volume ls --filter name=areschat-room-data-
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dev45/areschat-room:latest
            ghcr.io/dev45/areschat-room:${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: manager
          push: true
          tags: |
            ghcr.io/dev45/areschat-manager:latest
            ghcr.io/dev45/areschat-manager:${{ github.sha }}